function toolsBar(extra=''){return `<div class="toolbar"><input id="search" type="search" aria-label="Buscar registros" placeholder="Buscar por nome, pedido ou endereço" value="${esc(query)}">${extra}</div>`}
function matches(s){return String(s).toLocaleLowerCase().includes(query.toLocaleLowerCase())}
function render(){const r=routes[current];$('#title').textContent=profileId?(client(profileId)?.name||'Cliente não encontrado'):r[0];$('#subtitle').textContent=r[1];$('#nav').innerHTML=Object.entries(routes).map(([key,v])=>`<a href="#${key}" ${key===current?'aria-current="page"':''}>${icon(v[2])}<span>${key==='pedidos'?'Ordens':v[0]}</span></a>`).join('');const acts={atendimento:['Novo atendimento','order'],inicio:['Novo abastecimento','order'],clientes:['Novo cliente','client'],pedidos:['Novo abastecimento','order'],agenda:['Agendar entrega','order'],frota:['Novo caminhão','fleet'],estoque:['Novo material','stock'],financeiro:['Registrar despesa','expense'],recorrentes:['Nova recorrência','recurring']};$('#headerAction').innerHTML=profileId?btn('Editar cadastro','client',profileId,'primary'):acts[current]?btn('+ '+acts[current][0],acts[current][1],'','primary'):'';$('#view').innerHTML=(storageError?`<p role="alert" class="error">${esc(storageError)}</p>`:'')+views[current]();document.title=r[0]+' • H2Ostras';}
function serviceSummary(o){return '<div class="receipt"><b>Atendimento · '+esc(stage(o))+'</b><p>'+esc(o.channel||'Canal não informado')+' · '+esc(o.purpose||'Finalidade não informada')+'</p><p class="footnote">Antes de agendar, confirme a aprovação do orçamento com o cliente. A conclusão exige o nome de quem recebeu a água. O encerramento acontece quando a entrega está concluída e o valor integral foi registrado.</p>'+((o.history||[]).length?'<details><summary>Histórico de etapas</summary>'+o.history.map(h=>'<p>'+esc(h.from)+' → '+esc(h.to)+' · '+new Date(h.at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+'</p>').join('')+'</details>':'')+'</div>'}
const views={
atendimento(){const list=db.orders.filter(o=>matches(o.code+' '+client(o.client)?.name+' '+o.address)&&(!filter||stage(o)===filter));return toolsBar('<select id="statusFilter" aria-label="Filtrar status"><option value="">Todas as etapas</option>'+[...serviceStages.map(s=>s[0]),'Cancelado'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>')+
'<div class="metrics">'+metric('Em atendimento',db.orders.filter(o=>['Solicitação','Orçamento'].includes(o.status)).length,'Solicitações e propostas abertas')+metric('Na operação',db.orders.filter(o=>['Agendado','Em rota','Abastecendo'].includes(o.status)).length,'Aprovados e em execução')+metric('Entregues a receber',db.orders.filter(o=>o.status==='Entregue'&&o.total>o.paid).length,'Entrega concluída, saldo em aberto')+metric('Encerrados',db.orders.filter(o=>stage(o)==='Encerrado').length,'Entrega e pagamento concluídos')+'</div><section class="panel"><div class="panel-head"><div><h2>Fluxo de atendimento H2Ostras</h2><p class="muted">Acompanhe a solicitação, a entrega e o pagamento no mesmo registro.</p></div></div><p class="footnote">Solicitação → orçamento → agendamento → deslocamento → abastecimento → entrega → encerramento. Orçamentos não entram na agenda nem nas contas a receber.</p><div class="service-board">'+[...serviceStages,['Cancelado','Atendimentos cancelados, preservados no histórico.']].map(([s,desc])=>'<section class="lane"><div class="lane-title"><b>'+s+'</b>'+badge(String(list.filter(o=>stage(o)===s).length))+'</div><p class="footnote">'+desc+'</p>'+ (list.filter(o=>stage(o)===s).map(o=>'<article class="service-card">'+btn('#'+o.code+' · '+esc(client(o.client)?.name),'order',o.id,'link')+'<p>'+esc(o.water)+' · '+number(o.volume)+' L<br>'+esc(o.address||'Endereço a confirmar')+'</p><small>'+esc(o.channel||'Canal a informar')+' · '+date(o.date)+'</small><div class="row"><b>'+money(o.total)+'</b></div><div class="actions">'+(s==='Entregue'&&o.total>o.paid?btn('Registrar pagamento','payment',o.id):s!=='Encerrado'&&s!=='Cancelado'?btn('Avançar etapa →','advance',o.id):btn('Ver atendimento','order',o.id))+'</div></article>').join('')||'<div class="empty">Nenhum atendimento.</div>')+'</section>').join('')+'</div></section>'+ (filter==='Cancelado'?'<section class="panel">'+orderTable(list)+'</section>':'')},

inicio(){const due=active().filter(o=>o.date===today());return `<section class="welcome"><div><div class="eyebrow">${esc(db.settings.city)} · ${date(today())}</div><h2>Cada entrega, sob controle.</h2><p>Cadastre o cliente, programe o caminhão e acompanhe o abastecimento até o recebimento.</p></div>${btn('Criar abastecimento →','order','','accent')}</section><div class="metrics">${metric('Entregas de hoje',due.length,'Programadas para '+date(today()))}${metric('Em rota',active().filter(o=>o.status==='Em rota').length,'Abastecimentos em andamento')}${metric('Volume entregue',number(active().filter(o=>o.status==='Entregue').reduce((s,o)=>s+o.volume,0))+' L','Total dos pedidos concluídos')}${metric('A receber',money(active().reduce((s,o)=>s+o.total-o.paid,0)),'Saldo dos pedidos ativos')}</div><div class="split">${deliveryCalendar()}<section class="panel"><h2>O que precisa de atenção</h2><div class="row"><div><b>${active().filter(o=>!o.fleet&&o.status==='Agendado').length} entregas sem caminhão</b><small>Distribua a frota antes da saída.</small></div><a href="#pedidos">Ver →</a></div><div class="row"><div><b>${db.stock.filter(s=>s.quantity<=s.min).length} materiais em nível mínimo</b><small>Confira os itens para reposição.</small></div><a href="#estoque">Ver →</a></div><div class="row"><div><b>${db.clients.length} clientes cadastrados</b><small>Histórico e endereços em um só lugar.</small></div><a href="#clientes">Ver →</a></div></section></div>`},
pedidos(){const list=db.orders.filter(o=>matches(o.code+' '+client(o.client)?.name+' '+o.address)&&(!filter||o.status===filter));return toolsBar(`<select id="statusFilter" aria-label="Filtrar status"><option value="">Todos os status</option>${statuses.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select>`)+`<section class="panel"><div class="panel-head"><div><h2>Fluxo de abastecimento</h2><p class="muted">Clique no pedido para editar, despachar ou concluir.</p></div>${btn('Exportar CSV','csv')}</div><div class="board">${['Agendado','Em rota','Abastecendo','Entregue'].map(s=>`<section class="lane"><div class="lane-title"><b>${s}</b>${badge(String(list.filter(o=>o.status===s).length))}</div>${list.filter(o=>o.status===s).map(o=>`<button class="order-card" data-action="order" data-id="${o.id}"><span class="badge">#${o.code} · ${date(o.date)}</span><strong>${esc(client(o.client)?.name)}</strong><small>${esc(o.address)}<br>${esc(o.water)} · ${number(o.volume)} litros<br>${esc(truck(o.fleet)?.name||'Caminhão a definir')} · ${esc(o.time)}</small><footer><span>${money(o.total)}</span><span>${o.paid>=o.total&&o.total>0?'Recebido':'A receber'}</span></footer></button>`).join('')||'<div class="empty">Nenhum pedido nesta etapa.</div>'}</section>`).join('')}</div></section><section class="panel"><h2>Todos os pedidos · ${list.length}</h2>${orderTable(list)}</section>`},
clientes(){if(profileId)return customerProfile(profileId);return '<section class="client-intro"><div><span class="eyebrow">Relacionamento e acompanhamento</span><h2>Conheça a história de cada cliente.</h2><p>Atendimentos, entregas, pagamentos e pontos de atenção reunidos em um perfil. Clique no nome para acompanhar o relacionamento.</p></div></section>'+toolsBar()+`<section class="panel"><div class="panel-head"><h2>Base de clientes · ${db.clients.length}</h2></div>${table(['Cliente','Contato / endereço','Perfil / atenção','Pedidos','Recebido',''],db.clients.filter(c=>matches(c.name+' '+c.phone+' '+c.address)).map(c=>[`<a class="customer-name" href="#cliente/${encodeURIComponent(c.id)}">${esc(c.name)}</a>`,`${esc(c.phone||'Sem telefone')}<small>${esc(c.address||'Endereço a preencher')}</small>`,badge(c.kind)+(c.riskLevel&&c.riskLevel!=='Sem alerta'?'<small>'+badge(c.riskLevel)+'</small>':''),db.orders.filter(o=>o.client===c.id).length,money(db.orders.filter(o=>o.client===c.id).reduce((s,o)=>s+o.paid,0)),btn('Ver histórico','profile',c.id)]))}</section>`},
agenda(){const list=db.orders.filter(o=>o.date===agendaDay&&confirmed(o.status)).sort((a,b)=>a.time.localeCompare(b.time));return `<section class="panel"><div class="panel-head"><div><h2>Programação de entregas</h2><p class="muted">${list.length} entregas · ${number(list.reduce((s,o)=>s+o.volume,0))} litros</p></div><label>Data<input id="agendaDay" type="date" value="${agendaDay}"></label></div>${orderTable(list)}</section>`},
frota(){return toolsBar()+`<section class="panel">${table(['Caminhão','Motorista','Capacidade','Disponibilidade','Em rota',''],db.fleet.filter(f=>matches(f.name+' '+f.driver)).map(f=>[`<b>${esc(f.name)}</b>`,esc(f.driver),number(f.capacity)+' L',badge(f.status),db.orders.filter(o=>o.fleet===f.id&&executing(o.status)).length,btn('Editar','fleet',f.id)]))}</section>`},
estoque(){return toolsBar()+`<section class="panel">${table(['Material','Quantidade','Mínimo','Situação',''],db.stock.filter(s=>matches(s.name)).map(s=>[`<b>${esc(s.name)}</b>`,number(s.quantity)+' '+esc(s.unit),s.min,badge(s.quantity<=s.min?'Repor':'Disponível'),btn('Atualizar saldo','stock',s.id)]))}</section>`},
financeiro(){const income=db.payments.reduce((s,p)=>s+p.amount,0),expense=db.expenses.reduce((s,e)=>s+e.total,0);return `<div class="metrics">${metric('Recebido',money(income),'Pagamentos registrados')}${metric('A receber',money(active().reduce((s,o)=>s+o.total-o.paid,0)),'Saldo dos pedidos ativos')}${metric('Despesas',money(expense),'Lançamentos registrados')}${metric('Saldo',money(income-expense),'Recebimentos menos despesas')}</div><section class="panel"><div class="panel-head"><h2>Contas a receber</h2>${btn('Exportar pedidos CSV','csv')}</div>${table(['Pedido / cliente','Valor','Recebido','Saldo',''],active().filter(o=>o.total>o.paid).map(o=>[`#${o.code} · ${esc(client(o.client)?.name)}`,money(o.total),money(o.paid),money(o.total-o.paid),btn('Receber','payment',o.id)]))}</section><section class="panel"><h2>Despesas</h2>${table(['Descrição','Categoria','Data','Valor',''],db.expenses.map(e=>[esc(e.name),esc(e.category),date(e.date),money(e.total),btn('Editar','expense',e.id)]))}</section><section class="panel"><h2>Histórico de recebimentos</h2>${table(['Pedido','Data','Forma','Valor'],db.payments.map(p=>['#'+(db.orders.find(o=>o.id===p.order)?.code||'—'),date(p.date),esc(p.method),money(p.amount)]))}</section>`},
recorrentes(){return `<section class="panel"><h2>Abastecimentos recorrentes</h2><p class="muted">Gere a próxima entrega manualmente; a data seguinte avança pelo intervalo definido.</p>${table(['Cliente','Volume','Próxima entrega','Intervalo','Status',''],db.recurring.map(r=>[esc(client(r.client)?.name),number(r.volume)+' L',date(r.date),r.interval+' dias',badge(r.active?'Ativo':'Pausado'),`<div class="actions">${btn('Editar','recurring',r.id)}${r.active?btn('Gerar entrega','generate',r.id):''}</div>`]))}</section>`},
configuracoes(){return `<section class="panel settings"><h2>Dados da empresa</h2><form id="settingsForm"><div class="form-grid">${field('company','Nome da empresa',db.settings.company)}${field('city','Cidade / UF',db.settings.city)}${field('phone','Telefone',db.settings.phone,'tel',false)}${field('rate','Valor sugerido por 1.000 L (R$)',db.settings.rate,'number',true,'min="0" step="0.01"')}</div><div class="form-foot"><button class="primary">Salvar configurações</button></div><p class="error" id="settingsError"></p></form></section><section class="panel settings"><h2>Cópia dos dados</h2><p>Exporte clientes, entregas, frota, estoque e financeiro em um arquivo JSON.</p>${btn('Baixar backup','backup')}<p class="footnote">Os dados ficam neste navegador. Limpar os dados do site pode removê-los. O acesso privado do preview não substitui um sistema de usuários da empresa.</p></section>`}
};

function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function deliveryCalendar(){
 const first=new Date(calendarMonth+'-01T12:00:00'),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return isoDate(d)});
 const schedule=active(),list=schedule.filter(o=>o.date===calendarDay).sort((a,b)=>a.time.localeCompare(b.time));
 const title=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 return '<section class="panel calendar-panel"><div class="panel-head"><div><h2>Próximas entregas</h2><p class="muted">Visão de calendário para acompanhar a operação</p></div><a href="#agenda">Ver agenda →</a></div><div class="calendar-toolbar"><h3>'+title+'</h3><div class="actions">'+btn('‹','calendar-prev','','calendar-arrow')+btn('Hoje','calendar-today')+btn('›','calendar-next','','calendar-arrow')+'</div></div><div class="calendar-week" aria-hidden="true">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>'<span>'+w+'</span>').join('')+'</div><div class="calendar-grid" aria-label="Calendário de entregas">'+days.map(day=>{const os=schedule.filter(o=>o.date===day),liters=os.reduce((s,o)=>s+o.volume,0);return '<button type="button" class="calendar-day '+(day.slice(0,7)!==calendarMonth?'outside ':'')+(day===today()?'is-today ':'')+(day===calendarDay?'selected':'')+'" data-action="calendar-day" data-id="'+day+'" aria-pressed="'+(day===calendarDay)+'" aria-label="'+date(day)+', '+os.length+' entregas, '+number(liters)+' litros"><b>'+Number(day.slice(-2))+'</b>'+(os.length?'<span class="calendar-count">'+os.length+'<span class="day-label"> entrega'+(os.length>1?'s':'')+'</span></span>':'')+'</button>'}).join('')+'</div><div class="calendar-day-header"><div><h3>'+date(calendarDay)+'</h3><p class="muted">'+list.length+' entrega(s) · '+number(list.reduce((s,o)=>s+o.volume,0))+' L programados</p></div>'+btn('Abrir dia na agenda','calendar-agenda')+'</div><div class="calendar-deliveries">'+(list.map(o=>'<button class="calendar-delivery" data-action="order" data-id="'+esc(o.id)+'"><time>'+esc(o.time)+'</time><span><strong>'+esc(client(o.client)?.name)+'</strong><small>'+number(o.volume)+' L · '+esc(truck(o.fleet)?.name||'Sem caminhão')+'</small></span>'+badge(o.status)+'</button>').join('')||'<div class="empty">Nenhuma entrega programada para este dia.</div>')+'</div><p class="footnote">Inclui entregas confirmadas e concluídas. Solicitações, orçamentos e cancelamentos não ocupam a agenda.</p></section>'
}
function customerProfile(id){
 const c=client(id);if(!c)return '<section class="panel"><h2>Cliente não encontrado</h2><a href="#clientes">Voltar à base de clientes</a></section>';
 const orders=db.orders.filter(o=>o.client===id),ids=new Set(orders.map(o=>o.id)),payments=db.payments.filter(p=>ids.has(p.order)),valid=orders.filter(o=>confirmed(o.status)),balance=valid.reduce((s,o)=>s+o.total-o.paid,0),received=payments.reduce((s,p)=>s+p.amount,0);
 const events=[];
 if(c.createdAt)events.push({at:c.createdAt,label:'Cadastro criado',text:'Início do registro deste cliente na plataforma.'});
 for(const o of orders){if(o.createdAt)events.push({at:o.createdAt,label:'Atendimento #'+o.code+' criado',text:(o.channel||'Canal não informado')+' · '+o.water+' · '+number(o.volume)+' L',order:o.id});
 for(const h of o.history||[])events.push({at:h.at,label:'Pedido #'+o.code+' · '+h.from+' → '+h.to,text:o.address,order:o.id});
 if(!o.history?.length&&!o.createdAt)events.push({at:o.date?o.date+'T'+(o.time||'12:00')+':00-03:00':'',label:'Pedido #'+o.code+' · '+o.status,text:'Data programada da entrega. Registro anterior sem data de criação disponível.',order:o.id});
 }
 for(const p of payments)events.push({at:p.date+'T12:00:00-03:00',dateOnly:true,label:'Pagamento recebido · '+money(p.amount),text:p.method+' · Pedido #'+orders.find(o=>o.id===p.order)?.code,order:p.order});
 for(const i of c.interactions||[])events.push({at:i.at,label:i.kind,text:i.text});
 for(const h of c.profileHistory||[])events.push({at:h.at,label:'Atualização cadastral',text:h.text});
 events.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0));
 const delivered=orders.filter(o=>o.status==='Entregue');
 return '<div class="profile-back"><a href="#clientes">← Voltar à base de clientes</a></div><section class="panel customer-summary"><div><span class="eyebrow">Visão completa do relacionamento</span><h2>'+esc(c.name)+'</h2><p>'+esc(c.kind)+' · '+esc(c.phone||'Telefone não cadastrado')+'</p><p class="muted">'+esc(c.address||'Endereço a preencher')+'</p><p class="footnote">'+(c.createdAt?'Cliente cadastrado em '+new Date(c.createdAt).toLocaleDateString('pt-BR'):'Data de cadastro não disponível no registro anterior.')+'</p></div>'+btn('+ Registrar contato / ocorrência','customer-note',id,'primary')+'</section><div class="metrics">'+metric('Atendimentos',orders.length,'Inclui solicitações e cancelados')+metric('Volume entregue',number(delivered.reduce((s,o)=>s+o.volume,0))+' L',delivered.length+' entregas concluídas')+metric('Recebido',money(received),'Pagamentos registrados no histórico')+metric('Saldo em aberto',money(balance),'Pedidos confirmados, sem inferir atraso')+'</div><div class="profile-columns"><section class="panel"><div class="panel-head"><h2>Pontos de atenção e risco</h2>'+btn('Atualizar acompanhamento','client',id)+'</div><div class="risk-box">'+badge(c.riskLevel||'Sem alerta')+'<p>'+esc(c.riskReason||'Nenhum cuidado específico registrado pela equipe.')+'</p><p class="muted">Próximo contato: '+date(c.followup)+'</p></div><div class="row"><div><b>'+orders.filter(o=>o.status==='Cancelado').length+' atendimento(s) cancelado(s)</b><small>Consulte cada registro para entender o contexto.</small></div></div><div class="row"><div><b>'+valid.filter(o=>o.total>o.paid).length+' pedido(s) com saldo</b><small>Saldo em aberto não significa inadimplência. Não há vencimento de cobrança cadastrado.</small></div></div><h3>Observações do cliente</h3><p class="preserve">'+esc(c.notes||'Nenhuma observação cadastrada.')+'</p><p class="footnote">A classificação de acompanhamento é manual e deve ser justificada pela equipe.</p></section><section class="panel"><div class="panel-head"><div><h2>Linha do tempo do cliente</h2><p class="muted">Contatos, alterações, etapas e pagamentos registrados</p></div></div><ol class="timeline">'+(events.map(e=>'<li><small>'+ (e.at?(e.dateOnly?date(e.at.slice(0,10)):new Date(e.at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})):'Data não registrada')+'</small><b>'+esc(e.label)+'</b><p class="preserve">'+esc(e.text)+'</p>'+(e.order?btn('Abrir atendimento','order',e.order,'link'):'')+'</li>').join('')||'<li>Nenhum evento registrado. Registre o primeiro contato.</li>')+'</ol></section></div><section class="panel"><h2>Todos os atendimentos · '+orders.length+'</h2><p class="muted">Histórico completo, inclusive propostas e cancelamentos.</p>'+orderTable(orders.slice().sort((a,b)=>b.code-a.code))+'</section><section class="panel"><h2>Histórico financeiro</h2>'+table(['Data','Pedido','Forma','Valor'],payments.map(p=>[date(p.date),'#'+orders.find(o=>o.id===p.order)?.code,esc(p.method),money(p.amount)]))+'</section>'
}
function openCustomerNote(id){profileId=id;returnFocus=document.activeElement;$('#dialogTitle').textContent='Registrar contato / ocorrência';$('#dialogBody').innerHTML='<form id="customerNoteForm"><div class="form-grid">'+select('kind','Tipo de registro',['Contato','Ocorrência operacional','Observação de cobrança','Retorno combinado'],'Contato')+'<label class="wide">Descrição<textarea name="text" rows="5" required placeholder="Descreva o contato, o fato observado ou o combinado com o cliente."></textarea></label></div><p class="error" id="noteError" role="alert"></p><div class="form-foot">'+btn('Cancelar','close')+'<button class="primary">Salvar registro</button></div></form>';$('#dialog').showModal();$('#customerNoteForm select').focus()}

function field(name,label,value='',type='text',required=true,extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></label>`}
function select(name,label,items,value='',required=true){return `<label>${label}<select name="${name}" ${required?'required':''}><option value="">Selecione</option>${items.map(i=>{const [v,t]=Array.isArray(i)?i:[i,i];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
const notes=v=>`<label class="wide">Observações<textarea name="notes" rows="3">${esc(v)}</textarea></label>`;
let modalKind='',modalId='';
function openEditor(kind,id=''){modalKind=kind;modalId=id;returnFocus=document.activeElement;let title='',body='',extra='';
if(kind==='client'){const c=client(id)||{};title=id?'Perfil do cliente':'Cadastrar cliente';body=field('name','Nome / razão social',c.name)+select('kind','Tipo',['Residência','Condomínio','Empresa','Obra','Piscina'],c.kind||'Residência')+field('phone','Telefone',c.phone,'tel',false)+field('address','Endereço de entrega',c.address)+select('riskLevel','Acompanhamento de risco',['Sem alerta','Atenção','Revisão necessária'],c.riskLevel||'Sem alerta')+field('riskReason','Motivo / cuidado recomendado',c.riskReason,'text',false)+field('followup','Próximo contato',c.followup,'date',false)+notes(c.notes);if(id)extra=`<p class="footnote">O histórico completo permanece no perfil do cliente. O acompanhamento de risco é uma anotação da equipe, não uma classificação automática.</p>`;}
if(kind==='order'){if(!db.clients.length){notify('Cadastre um cliente para iniciar.');return openEditor('client')}const o=db.orders.find(o=>o.id===id)||{date:current==='agenda'?agendaDay:today(),time:'09:00',volume:5000,total:db.settings.rate*5,water:'Potável',status:current==='atendimento'?'Solicitação':'Agendado'};title=id?'Abastecimento #'+o.code:'Novo abastecimento';body=select('client','Cliente',db.clients.map(c=>[c.id,c.name]),o.client)+select('water','Tipo de água',['Potável','Não potável'],o.water)+field('volume','Volume (litros)',o.volume,'number',true,'min="1" step="1"')+field('total','Valor total (R$)',o.total,'number',true,'min="0" step="0.01"')+field('date','Data de entrega',o.date,'date',false)+field('time','Horário',o.time,'time',false)+field('address','Endereço de abastecimento',o.address)+select('fleet','Caminhão / motorista',db.fleet.map(f=>[f.id,`${f.name} · ${f.driver} · ${number(f.capacity)} L`]),o.fleet,false)+select('status','Etapa',statuses,o.status)+select('channel','Canal de atendimento',['WhatsApp','Telefone','Indicação','Presencial','Outro'],o.channel||'WhatsApp')+select('purpose','Finalidade',['Residência / cisterna','Condomínio','Piscina','Obra','Empresa','Outro'],o.purpose||'Residência / cisterna')+field('access','Acesso / mangueira / ponto de descarga',o.access,'text',false)+field('receiver','Responsável pelo recebimento',o.receiver,'text',false)+notes(o.notes);if(id)extra=`${serviceSummary(o)}<div class="receipt"><p><b>Recebido: ${money(o.paid)}</b> · Saldo: ${money(o.total-o.paid)}</p><p>Motorista: ${esc(truck(o.fleet)?.driver||'A definir')}</p></div>`;}
if(kind==='fleet'){const f=db.fleet.find(f=>f.id===id)||{};title=id?'Editar caminhão':'Cadastrar caminhão';body=field('name','Identificação / placa',f.name)+field('driver','Motorista',f.driver)+field('capacity','Capacidade (litros)',f.capacity||20000,'number',true,'min="1" step="1"')+select('status','Disponibilidade',['Disponível','Manutenção','Inativo'],f.status||'Disponível')+notes(f.notes)}
if(kind==='stock'){const s=db.stock.find(s=>s.id===id)||{};title=id?'Atualizar material':'Novo material';body=field('name','Material',s.name)+field('unit','Unidade',s.unit||'un.')+field('quantity','Saldo atual',s.quantity||0,'number',true,'min="0" step="1"')+field('min','Estoque mínimo',s.min||0,'number',true,'min="0" step="1"')}
if(kind==='expense'){const e=db.expenses.find(e=>e.id===id)||{};title=id?'Editar despesa':'Registrar despesa';body=field('name','Descrição',e.name)+select('category','Categoria',['Combustível','Manutenção','Água','Pessoal','Outros'],e.category||'Outros')+field('total','Valor (R$)',e.total,'number',true,'min="0.01" step="0.01"')+field('date','Data',e.date||today(),'date')}
if(kind==='payment'){const o=db.orders.find(o=>o.id===id);title='Receber pedido #'+o.code;extra=`<div class="receipt">${esc(client(o.client)?.name)} · Saldo ${money(o.total-o.paid)}</div>`;body=field('amount','Valor recebido (R$)',(o.total-o.paid).toFixed(2),'number',true,`min="0.01" max="${(o.total-o.paid).toFixed(2)}" step="0.01"`)+select('method','Forma de pagamento',['Pix','Dinheiro','Cartão','Transferência'],'Pix')+field('date','Data do recebimento',today(),'date')}
if(kind==='recurring'){if(!db.clients.length)return openEditor('client');const r=db.recurring.find(r=>r.id===id)||{};title=id?'Editar recorrência':'Novo abastecimento recorrente';body=select('client','Cliente',db.clients.map(c=>[c.id,c.name]),r.client)+select('water','Tipo de água',['Potável','Não potável'],r.water||'Potável')+field('volume','Volume (litros)',r.volume||5000,'number',true,'min="1" step="1"')+field('total','Valor por entrega (R$)',r.total??db.settings.rate*5,'number',true,'min="0" step="0.01"')+field('date','Próxima entrega',r.date||today(),'date')+field('interval','Intervalo (dias)',r.interval||7,'number',true,'min="1" max="365" step="1"')+select('active','Situação',[['yes','Ativo'],['no','Pausado']],r.active===false?'no':'yes')}
$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=extra+`<form id="editor"><div class="form-grid">${body}</div><p id="formError" role="alert" class="error"></p><div class="form-foot">${btn('Cancelar','close')}<button class="primary" type="submit">Salvar ${kind==='payment'?'recebimento':''}</button></div></form>`;if(!$('#dialog').open)$('#dialog').showModal();$('#editor input, #editor select')?.focus();}
function closeEditor(){$('#dialog').close();returnFocus?.isConnected&&returnFocus.focus()}
function saveEditor(form){const f=Object.fromEntries(new FormData(form));for(const k of Object.keys(f))f[k]=f[k].trim();const kind=modalKind,id=modalId;for(const k of ['volume','total','capacity','quantity','min','amount','interval'])if(k in f)f[k]=Number(f[k]);for(const el of form.querySelectorAll('[required]'))if(!String(f[el.name]??'').trim())throw Error('Preencha todos os campos obrigatórios.');
if(kind==='client'&&f.riskLevel!=='Sem alerta'&&!f.riskReason.trim())throw Error('Informe o motivo do alerta para orientar o acompanhamento.');
if(kind==='order'){if(!statuses.includes(f.status))throw Error('Etapa inválida.');if(confirmed(f.status)&&(!f.date||!f.time))throw Error('Defina data e horário antes de confirmar a entrega.');if(f.status==='Entregue'&&!f.receiver.trim())throw Error('Informe quem recebeu o abastecimento.');if(!client(f.client))throw Error('Selecione um cliente válido.');const previous=db.orders.find(o=>o.id===id);if(f.total<(previous?.paid||0))throw Error('O total não pode ser menor que o valor recebido.');if(!confirmed(f.status)&&previous?.paid>0)throw Error('Pedido com pagamento não pode voltar à solicitação, orçamento ou ser cancelado neste preview.');const t=truck(f.fleet);if(f.fleet&&(!t||t.capacity<f.volume))throw Error('O volume excede a capacidade do caminhão. Divida em entregas.');if(executing(f.status)){if(!t||t.status!=='Disponível')throw Error('Selecione um caminhão disponível para despachar.');if(db.orders.some(o=>o.id!==id&&o.fleet===f.fleet&&executing(o.status)))throw Error('Este caminhão já está em rota. Conclua a entrega anterior.')}f.code=previous?.code||Math.max(1000,...db.orders.map(o=>o.code))+1;f.paid=previous?.paid||0;f.history=[...(previous?.history||[])];if(!previous||previous.status!==f.status)f.history.push({from:previous?.status||'Novo',to:f.status,at:new Date().toISOString()});if(f.status==='Entregue'&&f.total>0&&f.paid>=f.total&&previous?.status!=='Entregue')f.history.push({from:'Entregue',to:'Encerrado',at:new Date().toISOString()});}
if(kind==='fleet'&&f.status!=='Disponível'&&db.orders.some(o=>o.fleet===id&&executing(o.status)))throw Error('Conclua a rota em andamento antes de indisponibilizar o caminhão.');
if(kind==='recurring')f.active=f.active==='yes';
if(kind==='payment'){const o=db.orders.find(o=>o.id===id);if(!o||!confirmed(o.status)||f.amount<=0||Math.round(f.amount*100)>Math.round((o.total-o.paid)*100))throw Error('O valor deve ser positivo e não exceder o saldo.');if(!change(n=>{n.orders.find(o=>o.id===id).paid=Math.round((o.paid+f.amount)*100)/100;n.payments.push({...f,id:uid(),order:id});const updated=n.orders.find(x=>x.id===id);if(stage(updated)==='Encerrado')updated.history=[...(updated.history||[]),{from:'Entregue',to:'Encerrado',at:new Date().toISOString()}]}))return;}
else{const collection={client:'clients',order:'orders',fleet:'fleet',stock:'stock',expense:'expenses',recurring:'recurring'}[kind];if(!change(n=>{const i=n[collection].findIndex(x=>x.id===id),record={...(i>=0?n[collection][i]:{}),...f,id:id||uid()};if(i>=0){if(kind==='client'){const prev=n[collection][i];record.profileHistory=[...(prev.profileHistory||[]),{at:new Date().toISOString(),text:'Cadastro atualizado'+(prev.riskLevel!==record.riskLevel||prev.riskReason!==record.riskReason?' · Acompanhamento: '+(record.riskLevel||'Sem alerta')+' — '+(record.riskReason||'Sem observação'):'')}]}n[collection][i]=record}else{record.createdAt=new Date().toISOString();n[collection].push(record)}}))return;}
closeEditor();render();notify('Registro salvo com sucesso.');}
function download(content,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function generate(id){const r=db.recurring.find(r=>r.id===id);if(!r?.active)return;const c=client(r.client);if(!c?.address){notify('Preencha o endereço do cliente antes de gerar a entrega.');return}if(db.orders.some(o=>o.recurring===id&&o.date===r.date)){notify('Esta entrega já foi gerada.');return}if(change(n=>{n.orders.push({id:uid(),code:Math.max(1000,...n.orders.map(o=>o.code))+1,client:r.client,water:r.water,volume:r.volume,total:r.total,paid:0,date:r.date,time:'09:00',address:c.address,fleet:'',status:'Agendado',notes:'Entrega recorrente',recurring:id});const d=new Date(r.date+'T12:00:00');d.setDate(d.getDate()+r.interval);n.recurring.find(x=>x.id===id).date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})){render();notify('Entrega gerada. A próxima data foi atualizada.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='profile'){location.hash='cliente/'+encodeURIComponent(id);return}if(a==='calendar-prev'||a==='calendar-next'){const d=new Date(calendarMonth+'-01T12:00:00');d.setMonth(d.getMonth()+(a==='calendar-prev'?-1:1));calendarMonth=isoDate(d).slice(0,7);calendarDay=calendarMonth+'-01';render();return}if(a==='calendar-today'){calendarDay=today();calendarMonth=calendarDay.slice(0,7);render();return}if(a==='calendar-day'){calendarDay=id;render();return}if(a==='calendar-agenda'){agendaDay=calendarDay;location.hash='agenda';return}if(a==='customer-note'){return openCustomerNote(id)}if(a==='close')return closeEditor();if(a==='backup')return download(JSON.stringify(db,null,2),'h2ostras-backup-'+today()+'.json','application/json');if(a==='csv'){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replaceAll('"','""')+'"';const rows=[['Pedido','Cliente','Data','Litros','Total','Recebido','Status'],...db.orders.map(o=>[o.code,client(o.client)?.name,o.date,o.volume,o.total,o.paid,o.status])];return download('\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'h2ostras-pedidos.csv','text/csv;charset=utf-8')}if(a==='generate')return generate(id);if(a==='advance'){const o=db.orders.find(o=>o.id===id),i=statuses.indexOf(o.status);openEditor('order',id);if(i>=0&&i<5)$('#editor [name=status]').value=statuses[i+1];return}openEditor(a,id)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='customerNoteForm'){const f=Object.fromEntries(new FormData(e.target));if(!f.text.trim()){$('#noteError').textContent='Descreva o contato ou ocorrência.';return}if(change(n=>{n.clients.find(c=>c.id===profileId).interactions=[...(n.clients.find(c=>c.id===profileId).interactions||[]),{id:uid(),at:new Date().toISOString(),kind:f.kind,text:f.text.trim()}]})){closeEditor();render();notify('Registro adicionado ao histórico do cliente.')}return}if(e.target.id==='editor'){try{saveEditor(e.target)}catch(err){$('#formError').textContent=err.message}}if(e.target.id==='settingsForm'){const f=Object.fromEntries(new FormData(e.target));if(!f.company.trim()||!f.city.trim()){$('#settingsError').textContent='Preencha nome e cidade.';return}if(change(n=>n.settings={...f,rate:Number(f.rate)})){render();notify('Configurações salvas.')}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){filter=e.target.value;render()}if(e.target.id==='agendaDay'){agendaDay=e.target.value||today();render()}if(e.target.name==='client'&&modalKind==='order'){$('#editor [name=address]').value=client(e.target.value)?.address||''}});
function route(){const aliases={home:'inicio',orders:'pedidos',clients:'clientes',fleet:'frota',finance:'financeiro',settings:'configuracoes',recurring:'recorrentes'};let key=location.hash.slice(1)||'inicio';profileId='';if(key.startsWith('cliente/')){try{profileId=decodeURIComponent(key.slice(8))}catch{}key='clientes'}key=aliases[key]||key;if(!routes[key]){location.hash='inicio';return}current=key;query='';filter='';render();window.scrollTo(0,0)}window.addEventListener('hashchange',route);$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeEditor()});route();
</script></body></html>
