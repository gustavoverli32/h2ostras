function calendarISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function agendaCalendar(){
 const first=new Date(calendarMonth+'-01T12:00:00'),start=new Date(first);
 start.setDate(1-(first.getDay()+6)%7);
 const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return calendarISO(d)});
 const orders=db.orders.filter(o=>confirmed(o.status));
 const byDay=new Map();for(const o of orders){if(!byDay.has(o.date))byDay.set(o.date,[]);byDay.get(o.date).push(o)}
 const selected=(byDay.get(agendaDay)||[]).slice().sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''))||a.code-b.code);
 return '<div class="agenda-layout"><section class="panel calendar-panel"><div class="calendar-toolbar"><h2>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</h2><div class="actions">'+btn('‹','calendar-prev','','calendar-arrow')+btn('Hoje','calendar-today')+btn('›','calendar-next','','calendar-arrow')+'</div></div><div class="calendar-week" aria-hidden="true">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>'<span>'+w+'</span>').join('')+'</div><div class="calendar-grid" aria-label="Calendário de entregas">'+days.map(day=>{const count=(byDay.get(day)||[]).length;return '<button type="button" class="calendar-day '+(day.slice(0,7)!==calendarMonth?'outside ':'')+(day===today()?'is-today ':'')+(day===agendaDay?'selected':'')+'" data-action="calendar-day" data-id="'+day+'" aria-pressed="'+(day===agendaDay)+'" '+(day===today()?'aria-current="date" ':'')+'aria-label="'+date(day)+', '+count+' entrega'+(count===1?'':'s')+'"><b>'+Number(day.slice(-2))+'</b>'+(count?'<span class="calendar-count">'+count+'<span class="day-label"> entrega'+(count===1?'':'s')+'</span></span>':'')+'</button>'}).join('')+'</div><p class="footnote">Os números indicam as entregas de cada dia.</p></section><section class="panel agenda-day"><div class="panel-head"><div><h2>Entregas de '+date(agendaDay)+'</h2><p class="muted" role="status">'+selected.length+' entrega'+(selected.length===1?'':'s')+' neste dia</p></div></div>'+
(selected.length?selected.map(o=>'<article class="agenda-delivery"><div class="agenda-delivery-top"><time>'+esc(o.time||'Horário a definir')+'</time>'+badge(o.status==='Agendado'?'Agendada':o.status==='Entregue'?'Concluída':o.status)+'</div><h3><a class="customer-name" href="#cliente/'+encodeURIComponent(o.client)+'">'+esc(client(o.client)?.name||'Cliente')+'</a></h3><p>'+number(o.volume)+' litros · '+esc(o.water)+'</p><p>'+esc(o.address||'Endereço a confirmar')+'</p>'+btn('Abrir venda #'+esc(o.code),'order',o.id)+'</article>').join(''):'<div class="empty">Nenhuma entrega programada.<br>Você pode cadastrar uma venda para este dia.</div>')+
'<p class="footnote">A agenda mostra vendas confirmadas e entregas concluídas.</p></section></div>';
}
function customerProfile(id){
 const c=client(id);if(!c)return '<section class="panel"><h2>Cliente não encontrado</h2><a href="#clientes">Voltar à base de clientes</a></section>';
 const orders=db.orders.filter(o=>o.client===id),ids=new Set(orders.map(o=>o.id)),payments=db.payments.filter(p=>ids.has(p.order)),valid=orders.filter(o=>confirmed(o.status)),balance=valid.reduce((s,o)=>s+o.total-o.paid,0),received=payments.reduce((s,p)=>s+p.amount,0);
 const events=[];

 for(const h of o.history||[])events.push({at:h.at,label:'Pedido #'+o.code+' · '+h.from+' → '+h.to,text:o.address,order:o.id});

 }
 for(const p of payments)events.push({at:p.date+'T12:00:00-03:00',dateOnly:true,label:'Pagamento recebido · '+money(p.amount),text:p.method+' · Pedido #'+orders.find(o=>o.id===p.order)?.code,order:p.order});
 for(const i of c.interactions||[])events.push({at:i.at,label:i.kind,text:i.text});
 for(const h of c.profileHistory||[])events.push({at:h.at,label:'Atualização cadastral',text:h.text});
 events.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0));
 const delivered=orders.filter(o=>o.status==='Entregue');

 return '<div class="profile-back"><a href="#clientes">← Voltar aos clientes</a></div><section class="panel customer-summary"><div><h2>'+esc(c.name)+'</h2><p>'+esc(c.phone||'Telefone não informado')+'</p><p class="muted">'+esc(c.address||'Endereço não informado')+'</p></div>'+btn('+ Registrar conversa','customer-note',id,'primary')+'</section>'+
'<div class="client-totals"><span><b>'+orders.length+'</b> atendimento(s)</span><span>A receber <b>'+money(balance)+'</b></span></div>'+
'<section class="panel"><h2>Vendas deste cliente</h2>'+simpleOrderList(orders.slice().sort((a,b)=>b.code-a.code))+'</section>'+
'<section class="panel"><h2>Histórico de conversas e atendimentos</h2><ol class="timeline">'+(events.map(e=>'<li><small>'+(e.at?(e.dateOnly?date(e.at.slice(0,10)):new Date(e.at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})):'Data não registrada')+'</small><b>'+esc(e.label)+'</b><p class="preserve">'+esc(e.text)+'</p>'+(e.order?btn('Ver venda','order',e.order,'link'):'')+'</li>').join('')||'<li>Nenhuma conversa registrada ainda.</li>')+'</ol></section>'+
'<details class="panel" '+(c.riskLevel&&c.riskLevel!=='Sem alerta'?'open':'')+'><summary>Observações e cuidados com o cliente'+(c.riskLevel&&c.riskLevel!=='Sem alerta'?' · '+esc(c.riskLevel):'')+'</summary><p class="preserve">'+esc(c.notes||'Nenhuma observação.')+'</p><p>'+esc(c.riskReason||'Nenhum cuidado específico registrado.')+'</p>'+(c.followup?'<p>Próximo contato: '+date(c.followup)+'</p>':'')+btn('Editar informações','client',id)+'</details>';

}
function openCustomerNote(id){profileId=id;returnFocus=document.activeElement;$('#dialogTitle').textContent='Registrar contato / ocorrência';$('#dialogBody').innerHTML='<form id="customerNoteForm"><div class="form-grid">'+select('kind','Tipo de registro',['Contato','Ocorrência operacional','Observação de cobrança','Retorno combinado'],'Contato')+'<label class="wide">Descrição<textarea name="text" rows="5" required placeholder="Descreva o contato, o fato observado ou o combinado com o cliente."></textarea></label></div><p class="error" id="noteError" role="alert"></p><div class="form-foot">'+btn('Cancelar','close')+'<button class="primary">Salvar registro</button></div></form>';$('#dialog').showModal();$('#customerNoteForm select').focus()}

function field(name,label,value='',type='text',required=true,extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></label>`}

const notes=v=>`<label class="wide">Observações<textarea name="notes" rows="3">${esc(v)}</textarea></label>`;
let modalKind='',modalId='';
function openEditor(kind,id=''){modalKind=kind;modalId=id;returnFocus=document.activeElement;let title='',body='',extra='';

if(kind==='client'){const c=client(id)||{};title=id?'Editar cliente':'Novo cliente';body=field('name','Nome do cliente',c.name)+field('phone','Telefone',c.phone,'tel',false)+'<div class="wide">'+field('address','Endereço de entrega',c.address,'text',false)+'</div><details class="wide optional"><summary>Observações e cuidados (opcional)</summary><div class="form-grid">'+select('kind','Tipo de cliente',['Residência','Condomínio','Empresa','Obra','Piscina'],c.kind||'Residência')+select('riskLevel','Acompanhamento',['Sem alerta','Atenção','Revisão necessária'],c.riskLevel||'Sem alerta')+field('riskReason','Motivo do cuidado',c.riskReason,'text',false)+field('followup','Próximo contato',c.followup,'date',false)+notes(c.notes||'')+'</div></details>';}
if(kind==='order'){const o=db.orders.find(o=>o.id===id);if(!o){location.hash='nova-venda';return}title='Venda #'+o.code;body=saleFields(o,true);extra='<div class="receipt"><b>'+esc(client(o.client)?.name)+'</b><p>'+money(o.total)+' · '+(o.total>o.paid?'A receber '+money(o.total-o.paid):o.total>0?'Pago':'Valor a definir')+'</p></div>';}

if(kind==='expense'){const e=db.expenses.find(e=>e.id===id)||{};title=id?'Editar despesa':'Registrar despesa';body=field('name','Descrição',e.name)+select('category','Categoria',['Combustível','Manutenção','Água','Pessoal','Outros'],e.category||'Outros')+field('total','Valor (R$)',e.total,'number',true,'min="0.01" step="0.01"')+field('date','Data',e.date||today(),'date')}
if(kind==='payment'){const o=db.orders.find(o=>o.id===id);title='Receber pedido #'+o.code;extra=`<div class="receipt">${esc(client(o.client)?.name)} · Saldo ${money(o.total-o.paid)}</div>`;body=field('amount','Valor recebido (R$)',(o.total-o.paid).toFixed(2),'number',true,`min="0.01" max="${(o.total-o.paid).toFixed(2)}" step="0.01"`)+select('method','Forma de pagamento',['Pix','Dinheiro','Cartão','Transferência'],'Pix')+field('date','Data do recebimento',today(),'date')}
$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=extra+`<form id="editor"><div class="form-grid">${body}</div><p id="formError" role="alert" class="error"></p><div class="form-foot">${btn('Cancelar','close')}<button class="primary" type="submit">Salvar ${kind==='payment'?'recebimento':''}</button></div></form>`;if(!$('#dialog').open)$('#dialog').showModal();$('#editor input, #editor select')?.focus();}

function openProgress(id,action){const o=db.orders.find(o=>o.id===id);if(!o)return;modalKind='order';modalId=id;returnFocus=document.activeElement;const finish=action==='finish-sale';$('#dialogTitle').textContent=finish?'Concluir entrega':'Confirmar venda';$('#dialogBody').innerHTML='<div class="receipt"><b>'+esc(client(o.client)?.name)+'</b><p>'+number(o.volume)+' litros · '+money(o.total)+'</p><p>'+esc(o.address)+'</p></div><form id="editor" data-progress="'+action+'"><div class="form-grid">'+(finish?'<div class="wide">'+field('receiver','Quem recebeu a água?',o.receiver||'')+'</div>':field('date','Dia da entrega',o.date||today(),'date')+field('time','Horário',o.time||'09:00','time'))+'</div><p class="error" id="formError" role="alert"></p><div class="form-foot">'+btn('Voltar','close')+'<button class="primary" type="submit">'+(finish?'Confirmar entrega':'Confirmar venda')+'</button></div></form>';$('#dialog').showModal();$('#editor input').focus()}
function closeEditor(){addingSaleClient=false;if($('#dialog').open)$('#dialog').close();returnFocus?.isConnected&&returnFocus.focus()}
function saveEditor(form){let f=Object.fromEntries(new FormData(form));for(const k of Object.keys(f))f[k]=f[k].trim();const kind=modalKind,id=modalId;
if(form.dataset.progress){const previous=db.orders.find(o=>o.id===id);if(!previous)throw Error('Venda não encontrada.');f={...previous,...f,status:form.dataset.progress==='confirm-sale'?'Agendado':'Entregue'};}
for(const k of ['volume','total','capacity','quantity','min','amount','interval'])if(k in f)f[k]=Number(f[k]);for(const el of form.querySelectorAll('[required]'))if(!String(f[el.name]??'').trim())throw Error('Preencha todos os campos obrigatórios.');
if(kind==='client'&&f.riskLevel!=='Sem alerta'&&!f.riskReason?.trim())throw Error('Informe o motivo do alerta para orientar o acompanhamento.');
if(kind==='order'){if(!statuses.includes(f.status))throw Error('Etapa inválida.');if(confirmed(f.status)&&(!f.date||!f.time))throw Error('Defina data e horário antes de confirmar a entrega.');if(f.status==='Entregue'&&!f.receiver?.trim())throw Error('Informe quem recebeu o abastecimento.');if(!client(f.client))throw Error('Selecione um cliente válido.');const previous=db.orders.find(o=>o.id===id);if(f.total<(previous?.paid||0))throw Error('O total não pode ser menor que o valor recebido.');if(!confirmed(f.status)&&previous?.paid>0)throw Error('Pedido com pagamento não pode voltar à solicitação, orçamento ou ser cancelado neste preview.');const t=truck(f.fleet);if(f.fleet&&(!t||t.capacity<f.volume))throw Error('O volume excede a capacidade do caminhão. Divida em entregas.');if(executing(f.status)){if(!t||t.status!=='Disponível')throw Error('Selecione um caminhão disponível para despachar.');if(db.orders.some(o=>o.id!==id&&o.fleet===f.fleet&&executing(o.status)))throw Error('Este caminhão já está em rota. Conclua a entrega anterior.')}f.code=previous?.code||Math.max(1000,...db.orders.map(o=>o.code))+1;f.paid=previous?.paid||0;f.history=[...(previous?.history||[])];if(!previous||previous.status!==f.status)f.history.push({from:previous?.status||'Novo',to:f.status,at:new Date().toISOString()});if(f.status==='Entregue'&&f.total>0&&f.paid>=f.total&&previous?.status!=='Entregue')f.history.push({from:'Entregue',to:'Encerrado',at:new Date().toISOString()});}
if(kind==='fleet'&&f.status!=='Disponível'&&db.orders.some(o=>o.fleet===id&&executing(o.status)))throw Error('Conclua a rota em andamento antes de indisponibilizar o caminhão.');
if(kind==='recurring')f.active=f.active==='yes';
if(kind==='payment'){const o=db.orders.find(o=>o.id===id);if(!o||!confirmed(o.status)||f.amount<=0||Math.round(f.amount*100)>Math.round((o.total-o.paid)*100))throw Error('O valor deve ser positivo e não exceder o saldo.');if(!change(n=>{n.orders.find(o=>o.id===id).paid=Math.round((o.paid+f.amount)*100)/100;n.payments.push({...f,id:uid(),order:id});const updated=n.orders.find(x=>x.id===id);if(stage(updated)==='Encerrado')updated.history=[...(updated.history||[]),{from:'Entregue',to:'Encerrado',at:new Date().toISOString()}]}))return;}
else{const collection={client:'clients',order:'orders',fleet:'fleet',stock:'stock',expense:'expenses',recurring:'recurring'}[kind];if(!change(n=>{const i=n[collection].findIndex(x=>x.id===id),record={...(i>=0?n[collection][i]:{}),...f,id:id||uid()};if(i>=0){if(kind==='client'){const prev=n[collection][i];record.profileHistory=[...(prev.profileHistory||[]),{at:new Date().toISOString(),text:'Cadastro atualizado'+(prev.riskLevel!==record.riskLevel||prev.riskReason!==record.riskReason?' · Acompanhamento: '+(record.riskLevel||'Sem alerta')+' — '+(record.riskReason||'Sem observação'):'')}]}n[collection][i]=record}else{record.createdAt=new Date().toISOString();n[collection].push(record)}}))return;}
if(kind==='client'&&addingSaleClient&&saleDraft){saleDraft.client=id||db.clients[db.clients.length-1].id;saleDraft.address=client(saleDraft.client)?.address||saleDraft.address||'';}
closeEditor();if(kind==='order'&&form.id==='saleForm'){saleDraft=null;location.hash='atendimento';}render();notify(kind==='order'?'Venda salva com sucesso.':'Registro salvo com sucesso.');}
function download(content,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('invalid',e=>{e.target.closest('details')?.setAttribute('open','')},true);

document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='customerNoteForm'){const f=Object.fromEntries(new FormData(e.target));if(!f.text.trim()){$('#noteError').textContent='Descreva o contato ou ocorrência.';return}if(change(n=>{n.clients.find(c=>c.id===profileId).interactions=[...(n.clients.find(c=>c.id===profileId).interactions||[]),{id:uid(),at:new Date().toISOString(),kind:f.kind,text:f.text.trim()}]})){closeEditor();render();notify('Registro adicionado ao histórico do cliente.')}return}if(e.target.id==='saleForm'){modalKind='order';modalId='';try{saveEditor(e.target)}catch(err){$('#saleError').textContent=err.message}return}if(e.target.id==='editor'){try{saveEditor(e.target)}catch(err){$('#formError').textContent=err.message}}if(e.target.id==='settingsForm'){const f=Object.fromEntries(new FormData(e.target));if(!f.company.trim()||!f.city.trim()){$('#settingsError').textContent='Preencha nome e cidade.';return}if(change(n=>n.settings={...f,rate:Number(f.rate)})){render();notify('Configurações salvas.')}}});
